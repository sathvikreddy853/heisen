name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache

      - name: (Optional) Setup ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 1G || true

      - name: Build (make)
        run: |
          # change this if your Makefile target is different
          make -j$(nproc)

      - name: Run tests (if present)
        run: |
          if [ -x test/run_unit_tests.sh ]; then
            bash test/run_unit_tests.sh
          elif [ -f test/run_tests.sh ]; then
            bash test/run_tests.sh
          else
            echo "No test script found under test/ — skipping tests"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: heisen-build
          path: |
            bin/
            build/
