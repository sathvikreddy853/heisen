name: Code Quality

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format
        run: |
          find src include -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 | \
          xargs -0 clang-format -i --style=file

      - name: Check for changes
        run: |
          git diff --exit-code || (echo "Code formatting issues found. Please run clang-format." && exit 1)

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake bison flex llvm-dev libclang-dev clang-tidy

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCODEGEN=OFF -DBUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find src -type f \( -name '*.cpp' \) -print0 | \
          xargs -0 -I {} sh -c 'clang-tidy {} -p build 2>&1 | grep "warning:" || true' | tee clang-tidy-output.txt
          if [ -s clang-tidy-output.txt ]; then
            echo "Clang-tidy warnings found:"
            cat clang-tidy-output.txt
            exit 1
          else
            echo "No clang-tidy warnings found. All checks passed!"
          fi
